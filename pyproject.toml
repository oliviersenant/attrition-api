[project]
name = "attrition-api"
version = "0.1.0"
description = "API de déploiement du modèle d'attrition ESN (Futurisys) — FastAPI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Modèle ---
    "scikit-learn>=1.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # --- Base de données ---
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Bruit de joblib/numpy 2.5 au chargement du modèle — hors de notre code.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
# Convention sklearn assumée : X (matrice de features) en majuscule.
ignore = ["N802", "N803", "N806"]

[tool.coverage.run]
source = ["app", "ml", "scripts"]

[tool.coverage.report]
# Plancher de qualité : la CI échoue sous ce seuil (les main() CLI qui
# ouvrent une vraie connexion DB sont volontairement exclus).
fail_under = 90
show_missing = true
