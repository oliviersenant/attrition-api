# CI/CD — lint + tests à chaque push/PR ; déploiement HF Spaces sur tag v*.
# Le job « test » est le status check requis par la protection de branche :
# aucun merge dans main sans qu'il soit vert. Le job « deploy » ne tourne que
# sur un tag de version, et seulement si « test » est vert (needs).

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"] # un tag de version déclenche le déploiement
  pull_request:
    branches: [main]

# Un même commit poussé sur une branche de PR ne tourne qu'une fois :
# la nouvelle exécution annule la précédente encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # vigilance brief : un pipeline > 10 min doit interroger

    # Postgres éphémère : les tests DB/API tournent contre un vrai Postgres
    # (comme en prod), pas seulement le fallback SQLite du poste local.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: attrition_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/attrition_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv (avec cache des dépendances)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer l'environnement (verrouillé sur uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      # Décision « régénération plutôt que Git LFS » : l'artefact n'est pas
      # versionné, les tests API le chargent tel qu'il démarre en production.
      - name: Régénérer l'artefact du modèle
        run: uv run python -m ml.train

      - name: Tests + couverture (pytest)
        # Le seuil minimal (fail_under=90) est défini dans pyproject.toml :
        # la CI échoue si la couverture régresse sous ce plancher.
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publier le rapport de couverture (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: coverage.xml

  deploy:
    name: Déploiement Render
    needs: test # ne déploie jamais du code qui n'a pas passé les tests
    if: startsWith(github.ref, 'refs/tags/v') # uniquement sur un tag de version
    runs-on: ubuntu-latest
    # Environnement GitHub « production » : c'est lui qui porte le secret de
    # déploiement (RENDER_DEPLOY_HOOK) et permet, au besoin, une validation
    # manuelle avant mise en prod.
    environment: production

    steps:
      - name: Déclencher le déploiement Render
        # Le deploy hook demande à Render de reconstruire l'image (qui
        # ré-entraîne le modèle) et de redéployer le service.
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
